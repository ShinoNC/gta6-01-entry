<!DOCTYPE html>
<!-- Human character sample — STANDALONE PREVIEW ONLY, not wired into the game.
     Two stylized humans (male player + female pedestrian), round geometry, faces. -->
<html lang="en"><head><meta charset="utf-8">
<title>Human sample — VICE ROYALE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#ece7dc}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .label{position:fixed;bottom:26px;transform:translateX(-50%);font:700 22px "Courier New",monospace;
    color:#2b2118;background:rgba(255,255,255,.75);padding:8px 18px;border-radius:8px;letter-spacing:1px}
  #l1{left:25%} #l2{left:75%}
  #title{position:fixed;top:22px;left:50%;transform:translateX(-50%);font:700 26px "Courier New",monospace;
    color:#2b2118;letter-spacing:2px}
</style>
<script type="importmap">{"imports":{"three":"../game/vendor/three.module.min.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="title">HUMAN CHARACTER SAMPLE</div>
<div class="label" id="l1">PLAYER (male)</div>
<div class="label" id="l2">PEDESTRIAN (female)</div>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xece7dc);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0.3, 1.3, 3.55);
camera.lookAt(0, 0.98, 0);

scene.add(new THREE.HemisphereLight(0xfff6e6, 0x8a7f6a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(2.5, 4.5, 3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -3; sun.shadow.camera.right = 3;
sun.shadow.camera.top = 3; sun.shadow.camera.bottom = -3;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe4ff, 0.6);
fill.position.set(-3, 2, 2.5);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 48),
  new THREE.MeshStandardMaterial({ color: 0xd9d2c0, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const M = (color, rough = 0.75) => new THREE.MeshStandardMaterial({ color, roughness: rough });
const DARK = M(0x1a1210, 0.4);

function mesh(geo, mat, x, y, z, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  parent.add(m);
  return m;
}

// Build one stylized human, ~1.8 m tall. Faces +Z.
function buildHuman({ skin, shirt, pants, shoe, hair, female }) {
  const g = new THREE.Group();
  const skinM = M(skin, 0.6), shirtM = M(shirt, 0.8), pantsM = M(pants, 0.85),
        shoeM = M(shoe, 0.5), hairM = M(hair, 0.9);

  // ---- legs (hip 0.95 -> ankle 0.10) ----
  for (const s of [-1, 1]) {
    const hx = s * 0.095;
    mesh(new THREE.CapsuleGeometry(0.072, 0.30, 6, 14), pantsM, hx, 0.72, 0, g); // thigh
    mesh(new THREE.CapsuleGeometry(0.056, 0.30, 6, 14), pantsM, hx, 0.32, 0, g); // shin
    const foot = mesh(new THREE.BoxGeometry(0.115, 0.075, 0.26), shoeM, hx, 0.038, 0.045, g);
    const toe = mesh(new THREE.SphereGeometry(0.058, 12, 10), shoeM, hx, 0.04, 0.165, g);
    toe.scale.set(1, 0.65, 1);
    foot.castShadow = toe.castShadow = true;
  }

  // ---- pelvis / hips ----
  const hip = mesh(new THREE.CylinderGeometry(0.175, 0.165, 0.16, 20), pantsM, 0, 0.99, 0, g);
  hip.scale.z = 0.68;

  // ---- torso: tapered cylinder, wider at shoulders ----
  const torso = mesh(new THREE.CylinderGeometry(0.215, 0.16, 0.50, 24), shirtM, 0, 1.28, 0, g);
  torso.scale.z = 0.62;
  if (female) { // chest: two subtle soft curves under the shirt
    for (const s of [-1, 1]) {
      const b = mesh(new THREE.SphereGeometry(0.058, 14, 12), shirtM, s * 0.08, 1.40, 0.088, g);
      b.scale.set(1, 0.9, 0.42);
    }
  }
  // collar
  const collar = mesh(new THREE.TorusGeometry(0.085, 0.02, 8, 20), shirtM, 0, 1.53, 0, g);
  collar.rotation.x = Math.PI / 2;

  // ---- neck + head ----
  mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.09, 12), skinM, 0, 1.565, 0, g);
  const headY = 1.70, headR = 0.13;
  const head = mesh(new THREE.SphereGeometry(headR, 28, 22), skinM, 0, headY, 0, g);
  head.scale.set(0.94, 1.06, 0.96);
  // ears
  for (const s of [-1, 1]) {
    const ear = mesh(new THREE.SphereGeometry(0.032, 10, 8), skinM, s * 0.122, headY, 0, g);
    ear.scale.set(0.45, 0.8, 0.7);
  }
  // eyes (dark spheres, slightly proud of the face)
  for (const s of [-1, 1]) {
    mesh(new THREE.SphereGeometry(0.019, 12, 10), DARK, s * 0.05, headY + 0.015, 0.118, g);
    const brow = mesh(new THREE.BoxGeometry(0.052, 0.009, 0.012), hairM, s * 0.05, headY + 0.052, 0.12, g);
    brow.rotation.z = s * -0.12;
  }
  // nose (small cone pointing forward-down)
  const nose = mesh(new THREE.ConeGeometry(0.013, 0.035, 10), skinM, 0, headY - 0.018, 0.128, g);
  nose.rotation.x = Math.PI / 2 + 0.35;
  // mouth
  mesh(new THREE.BoxGeometry(0.052, 0.009, 0.01), DARK, 0, headY - 0.062, 0.117, g);

  // ---- hair ----
  // Hairline: the cap is tilted forward so its front edge dips over the
  // forehead like a natural hairline (no separate fringe band — it read as a blindfold).
  if (!female) {
    // short crop: cap over the top of the head
    const cap = mesh(new THREE.SphereGeometry(headR * 1.06, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.52), hairM, 0, headY + 0.012, -0.008, g);
    cap.scale.set(0.96, 1.02, 0.98);
    cap.rotation.x = 0.22;
  } else {
    // long hair: cap + back sheet down to the shoulders (BACK ONLY, never over the face)
    const cap = mesh(new THREE.SphereGeometry(headR * 1.07, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.58), hairM, 0, headY + 0.012, -0.01, g);
    cap.scale.set(0.97, 1.02, 0.99);
    cap.rotation.x = 0.16;
    // theta: 0 = front (+Z), PI = back; back-only span centred on PI
    const back = mesh(new THREE.CylinderGeometry(0.135, 0.165, 0.36, 16, 1, true, Math.PI * 0.68, Math.PI * 0.64), hairM, 0, headY - 0.17, -0.015, g);
    back.scale.z = 0.9;
    for (const s of [-1, 1]) {
      const lock = mesh(new THREE.CapsuleGeometry(0.026, 0.2, 4, 10), hairM, s * 0.125, headY - 0.16, 0.03, g);
      lock.rotation.x = 0.1;
    }
  }

  // ---- arms (shoulder 1.46 -> wrist ~0.92), slight outward hang ----
  for (const s of [-1, 1]) {
    const sh = mesh(new THREE.SphereGeometry(0.062, 14, 12), shirtM, s * 0.225, 1.46, 0, g);
    const upper = mesh(new THREE.CapsuleGeometry(0.05, 0.20, 6, 12), shirtM, s * 0.255, 1.31, 0, g);
    upper.rotation.z = s * 0.07;
    const elbow = mesh(new THREE.SphereGeometry(0.047, 12, 10), skinM, s * 0.268, 1.17, 0, g);
    const fore = mesh(new THREE.CapsuleGeometry(0.044, 0.19, 6, 12), skinM, s * 0.275, 1.02, 0, g);
    fore.rotation.z = s * 0.05;
    const hand = mesh(new THREE.SphereGeometry(0.05, 12, 10), skinM, s * 0.28, 0.88, 0.01, g);
    hand.scale.set(0.85, 1.25, 0.9);
  }
  return g;
}

const male = buildHuman({
  skin: 0xe8b08a, shirt: 0xe63946, pants: 0x2a4d8f, shoe: 0x2b2118, hair: 0x241812, female: false,
});
male.position.x = -0.62;
male.rotation.y = -0.42;
scene.add(male);

const female = buildHuman({
  skin: 0xc68642, shirt: 0x2a9d8f, pants: 0x3a3348, shoe: 0x5a2d2d, hair: 0x3b2416, female: true,
});
female.position.x = 0.62;
female.rotation.y = -0.42;
scene.add(female);

renderer.render(scene, camera);
window.__ready = true;
</script>
</body></html>
