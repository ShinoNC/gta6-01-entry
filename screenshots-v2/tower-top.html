<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office tower top-down</title>
<style>html, body { margin: 0; padding: 0; background: #bfd9e8; }</style>
<script type="importmap">
{ "imports": { "three": "../game/vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
import * as THREE from 'three';
import { loadProp } from '../game/src/models_loader.js';
const W = 900, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd9e8);
// Top-down: camera above the tower centre, looking straight down.
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
camera.position.set(0, 150, 0.01);
camera.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x9a8a76, 1.7));
const sun = new THREE.DirectionalLight(0xfff2d0, 3.0);
sun.position.set(-30, 80, 40);
scene.add(sun);
const tower = await loadProp('office-tower');
tower.position.set(0, 0, -4.35); // centre it like the game does
scene.add(tower);
// Spire + helipad exactly as city.js places them, in test coords
// (plot centre = origin; game world (26, 25.15) -> (0, -0.85)).
const spire = new THREE.Mesh(
  new THREE.CylinderGeometry(0.8, 2, 12, 6),
  new THREE.MeshLambertMaterial({ color: 0xffb703 }),
);
spire.position.set(0, 68.5, -0.85);
scene.add(spire);
const tip = new THREE.Mesh(
  new THREE.SphereGeometry(0.7, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xff2a3a }),
);
tip.position.set(0, 75, -0.85);
scene.add(tip);
const padRim = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 24),
  new THREE.MeshLambertMaterial({ color: 0xf2f0e8 }),
);
padRim.rotation.x = -Math.PI / 2;
padRim.position.set(2.8, 62.62, -6.85);
const pad = new THREE.Mesh(
  new THREE.CircleGeometry(2.9, 24),
  new THREE.MeshLambertMaterial({ color: 0x3a3f4a }),
);
pad.rotation.x = -Math.PI / 2;
pad.position.set(2.8, 62.64, -6.85);
const hMat = new THREE.MeshLambertMaterial({ color: 0xf2f0e8 });
const hL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 3.4), hMat);
hL.position.set(1.7, 62.67, -6.85);
const hR = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 3.4), hMat);
hR.position.set(3.9, 62.67, -6.85);
const hC = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.05, 0.5), hMat);
hC.position.set(2.8, 62.67, -6.85);
scene.add(padRim, pad, hL, hR, hC);
function loop() {
  requestAnimationFrame(loop);
  renderer.render(scene, camera);
}
loop();
window.__READY__ = true;
</script>
</body>
</html>
