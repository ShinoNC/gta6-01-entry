<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vinish Weapons — Sample</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ede4; font-family: "Courier New", monospace; }
  #title { text-align: center; font-size: 26px; font-weight: bold; letter-spacing: 4px; padding: 16px 0 4px; color: #222; }
  #sub { text-align: center; font-size: 13px; color: #555; padding-bottom: 8px; }
  #stage { position: relative; width: 1500px; height: 900px; margin: 0 auto; }
  #stage canvas { display: block; }
  .label { position: absolute; transform: translate(-50%, 0); background: rgba(255,255,255,0.92); border: 1px solid #ccc; border-radius: 6px; padding: 5px 10px; text-align: center; font-size: 13px; line-height: 1.45; color: #222; white-space: nowrap; }
  .label b { font-size: 14px; }
  .label span { color: #666; font-size: 11px; }
  #status { text-align: center; font-size: 13px; color: #888; padding: 8px; }
</style>
<script type="importmap">
{ "imports": { "three": "../game/vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="title">VINISH WEAPONS — SAMPLE</div>
<div id="sub">7 free models (CC BY 4.0) · loaded as GLB in Three.js · each normalised to fit its cell · ★ = already downloaded</div>
<div id="stage"></div>
<div id="status">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './models/GLTFLoader.js';

// Grid: 4 cols (row 1) + 3 cols (row 2). Guns point along +Z, grip down.
// Long guns lean back 60 deg (rotX) so the barrel reads diagonally instead of
// foreshortened flat; the pistol lies flat (rotZ); the grenade uses a small cell.
const MODELS = [
  // Row 1 (back, z = -3): the game's 3 guns + assault rifle
  { file: 'models/vinish-assets/pistol.glb', name: '★ Pistol', cat: 'Handgun', size: '269 KB', x: -5.4, z: -4, rotZ: -Math.PI / 2 },
  { file: 'models/vinish-assets/submachine-gun.glb', name: 'Submachine Gun', cat: 'SMG', size: '357 KB', x: -1.8, z: -4, rotX: -Math.PI / 3 },
  { file: 'models/vinish-assets/pump-shotgun.glb', name: 'Pump Shotgun', cat: 'Shotgun', size: '231 KB', x: 1.8, z: -4, rotX: -Math.PI / 3 },
  { file: 'models/vinish-assets/assault-rifle.glb', name: '★ Assault Rifle', cat: 'Rifle', size: '631 KB', x: 5.4, z: -4, rotX: -Math.PI / 3 },
  // Row 2 (front, z = 3): extras
  { file: 'models/vinish-assets/sniper-rifle.glb', name: 'Sniper Rifle', cat: 'Rifle', size: '483 KB', x: -3.6, z: 4, rotX: -Math.PI / 3 },
  { file: 'models/vinish-assets/rocket-launcher.glb', name: 'Rocket Launcher', cat: 'Launcher', size: '272 KB', x: 0, z: 4, rotX: -Math.PI / 3 },
  { file: 'models/vinish-assets/hand-grenade.glb', name: 'Hand Grenade', cat: 'Explosive', size: '136 KB', x: 3.6, z: 4, cell: 1.2 },
];

const W = 1500, H = 900;
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2ede4);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
camera.position.set(0, 8.5, 15.5);
camera.lookAt(0, 0.6, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdb8, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.camera.far = 40;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7);
fill.position.set(-8, 6, 6);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 30),
  new THREE.MeshStandardMaterial({ color: 0xe2d9c8, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
const loaded = [];
const failed = [];

function worldToScreen(wx, wy, wz) {
  const v = new THREE.Vector3(wx, wy, wz).project(camera);
  return { px: (v.x * 0.5 + 0.5) * W, py: (-v.y * 0.5 + 0.5) * H };
}

function addLabel(m) {
  const p = worldToScreen(m.x, 0, m.z);
  const d = document.createElement('div');
  d.className = 'label';
  d.style.left = p.px + 'px';
  d.style.top = (p.py + 50) + 'px';
  d.innerHTML = `<b>${m.name}</b><br><span>${m.cat} · ${m.size}</span>`;
  stage.appendChild(d);
}

// Normalise each model to fit a 2.6 m box (max dimension), feet on ground.
// A model may override with its own `cell` (the grenade would otherwise dwarf all).
const CELL = 2.6;
let pending = MODELS.length;
for (const m of MODELS) {
  loader.load(m.file, (gltf) => {
    const root = gltf.scene;
    scene.add(root);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const s = (m.cell || CELL) / maxDim;
    root.scale.setScalar(s);
    root.rotation.y = Math.PI * 0.15; // slight 3/4 turn
    if (m.rotZ) root.rotation.z = m.rotZ; // lay the gun barrel sideways
    if (m.rotX) root.rotation.x = m.rotX; // lean the gun back, barrel up
    root.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(root);
    root.position.x = m.x - (box2.min.x + box2.max.x) / 2;
    root.position.y = -box2.min.y;
    root.position.z = m.z - (box2.min.z + box2.max.z) / 2;
    root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });
    console.log(m.name, 'real size:', size.x.toFixed(2), 'x', size.y.toFixed(2), 'x', size.z.toFixed(2), 'm, scale', s.toFixed(2));
    loaded.push(m.name);
    addLabel(m);
    if (--pending === 0) finish();
  }, undefined, (err) => {
    console.error(m.name, 'FAILED', err);
    failed.push(m.name);
    if (--pending === 0) finish();
  });
}

function finish() {
  statusEl.textContent = 'loaded: ' + loaded.length + '/7' + (failed.length ? ' | FAILED: ' + failed.join(', ') : '');
  window.__READY__ = true;
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
