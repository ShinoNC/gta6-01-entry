<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Procedural Bus — Sample</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ede4; font-family: "Courier New", monospace; }
  #title { text-align: center; font-size: 26px; font-weight: bold; letter-spacing: 4px; padding: 16px 0 4px; color: #222; }
  #sub { text-align: center; font-size: 13px; color: #555; padding-bottom: 8px; }
  #stage { position: relative; width: 1280px; height: 680px; margin: 0 auto; }
  #stage canvas { display: block; }
  #status { text-align: center; font-size: 13px; color: #888; padding: 8px; }
</style>
<script type="importmap">
{ "imports": { "three": "../game/vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="title">PROCEDURAL BUS — SAMPLE</div>
<div id="sub">Vinish has no bus — built from geometry (extruded wedge profile, bevelled edges) · 10.2m × 2.5m × 3.1m · white + teal + coral</div>
<div id="stage"></div>
<div id="status">loading…</div>
<script type="module">
import * as THREE from 'three';
import { createBus } from '../../tools-backup/bus-model.js';

const W = 1280, H = 680;
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2ede4);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdb8, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.camera.far = 40;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7);
fill.position.set(-8, 6, 6);
scene.add(fill);

// Ground + a light road strip under the bus.
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 48),
  new THREE.MeshLambertMaterial({ color: 0xe8e0d0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(16, 5.5),
  new THREE.MeshLambertMaterial({ color: 0x9a9aa2 })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.01;
road.receiveShadow = true;
scene.add(road);

const { group: bus } = createBus();
scene.add(bus);

const VIEWS = {
  hero: { pos: [-9, 4.5, 11], look: [0, 1.4, 0] },
  side: { pos: [-12, 1.8, 0], look: [0, 1.5, 0] },
  front: { pos: [0, 2.0, 14], look: [0, 1.6, 0] },
};
function setView(name) {
  const v = VIEWS[name] || VIEWS.hero;
  camera.position.set(...v.pos);
  camera.lookAt(...v.look);
  statusEl.textContent = `view: ${name} · 10.2m city bus · rounded wedge body, sloped windshield, 4 wheels`;
}
window.__setView = setView;
setView('hero');

renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.__READY__ = true;
</script>
</body>
</html>
