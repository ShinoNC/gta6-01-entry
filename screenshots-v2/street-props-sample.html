<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vinish Street Props — Sample</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ede4; font-family: "Courier New", monospace; }
  #title { text-align: center; font-size: 26px; font-weight: bold; letter-spacing: 4px; padding: 16px 0 4px; color: #222; }
  #sub { text-align: center; font-size: 13px; color: #555; padding-bottom: 8px; }
  .stage { position: relative; width: 1500px; height: 560px; margin: 0 auto; }
  .stage canvas { display: block; }
  .label { position: absolute; transform: translate(-50%, 0); background: rgba(255,255,255,0.92); border: 1px solid #ccc; border-radius: 6px; padding: 3px 7px; text-align: center; font-size: 11px; line-height: 1.4; color: #222; white-space: nowrap; }
  .label b { font-size: 12px; }
  .label span { color: #666; font-size: 10px; }
  #status { text-align: center; font-size: 13px; color: #888; padding: 8px; }
</style>
<script type="importmap">
{ "imports": { "three": "../game/vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="title">VINISH STREET PROPS — SAMPLE</div>
<div id="sub">20 free models (CC BY 4.0) · loaded as GLB in Three.js · each normalised to fit its cell</div>
<div id="stage1" class="stage"></div>
<div id="stage2" class="stage"></div>
<div id="status">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './models/GLTFLoader.js';

// Two panels of 10 (5 cols x 2 rows each) — one perspective grid of 20 crowds the labels.
const PANELS = [
  { el: document.getElementById('stage1'), models: [
    { file: 'models/vinish-assets/bus-stop.glb', name: 'Bus Stop', cat: 'Street furniture', size: '207 KB', x: -8, z: -4 },
    { file: 'models/vinish-assets/billboard.glb', name: 'Billboard', cat: 'Street prop', size: '93 KB', x: -4, z: -4 },
    { file: 'models/vinish-assets/utility-pole.glb', name: 'Utility Pole', cat: 'Street prop', size: '116 KB', x: 0, z: -4 },
    { file: 'models/vinish-assets/food-cart.glb', name: 'Food Cart', cat: 'Street vendor', size: '74 KB', x: 4, z: -4 },
    { file: 'models/vinish-assets/vending-machine.glb', name: 'Vending Machine', cat: 'Machine', size: '91 KB', x: 8, z: -4 },
    { file: 'models/vinish-assets/bicycle.glb', name: 'Bicycle', cat: 'Bicycle', size: '245 KB', x: -8, z: 4 },
    { file: 'models/vinish-assets/kick-scooter.glb', name: 'Kick Scooter', cat: 'E-scooter', size: '52 KB', x: -4, z: 4 },
    { file: 'models/vinish-assets/bike-rack.glb', name: 'Bike Rack', cat: 'Street furniture', size: '54 KB', x: 0, z: 4 },
    { file: 'models/vinish-assets/parking-meter.glb', name: 'Parking Meter', cat: 'Street furniture', size: '55 KB', x: 4, z: 4 },
    { file: 'models/vinish-assets/manhole-cover.glb', name: 'Manhole Cover', cat: 'Street prop', size: '88 KB', x: 8, z: 4 },
  ]},
  { el: document.getElementById('stage2'), models: [
    { file: 'models/vinish-assets/stop-sign.glb', name: 'Stop Sign', cat: 'Road sign', size: '29 KB', x: -8, z: -4 },
    { file: 'models/vinish-assets/yield-sign.glb', name: 'Yield Sign', cat: 'Road sign', size: '24 KB', x: -4, z: -4 },
    { file: 'models/vinish-assets/speed-limit-sign.glb', name: 'Speed Limit Sign', cat: 'Road sign', size: '47 KB', x: 0, z: -4 },
    { file: 'models/vinish-assets/street-name-sign.glb', name: 'Street Name Sign', cat: 'Road sign', size: '50 KB', x: 4, z: -4 },
    { file: 'models/vinish-assets/road-works-sign.glb', name: 'Road Works Sign', cat: 'Road sign', size: '31 KB', x: 8, z: -4 },
    { file: 'models/vinish-assets/wheelie-bin.glb', name: 'Wheelie Bin', cat: 'Bin', size: '24 KB', x: -8, z: 4 },
    { file: 'models/vinish-assets/dumpster.glb', name: 'Dumpster', cat: 'Bin', size: '37 KB', x: -4, z: 4 },
    { file: 'models/vinish-assets/litter-bin.glb', name: 'Litter Bin', cat: 'Bin', size: '106 KB', x: 0, z: 4 },
    { file: 'models/vinish-assets/road-barrier.glb', name: 'Road Barrier', cat: 'Barrier', size: '47 KB', x: 4, z: 4 },
    { file: 'models/vinish-assets/street-bollard.glb', name: 'Street Bollard', cat: 'Barrier', size: '51 KB', x: 8, z: 4 },
  ]},
];

const W = 1500, H = 560;
const statusEl = document.getElementById('status');
const loader = new GLTFLoader();
const loaded = [];
const failed = [];
let pending = 20;

function buildPanel(panel) {
  const stage = panel.el;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf2ede4);
  const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
  camera.position.set(0, 7.5, 19);
  camera.lookAt(0, 0.8, 0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdb8, 1.1));
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
  sun.position.set(6, 12, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
  sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
  sun.shadow.camera.far = 40;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7);
  fill.position.set(-8, 6, 6);
  scene.add(fill);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(44, 28),
    new THREE.MeshStandardMaterial({ color: 0xe2d9c8, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  function worldToScreen(wx, wy, wz) {
    const v = new THREE.Vector3(wx, wy, wz).project(camera);
    return { px: (v.x * 0.5 + 0.5) * W, py: (-v.y * 0.5 + 0.5) * H };
  }

  function addLabel(m) {
    const p = worldToScreen(m.x, 0, m.z);
    const d = document.createElement('div');
    d.className = 'label';
    d.style.left = p.px + 'px';
    d.style.top = (p.py + 6) + 'px';
    d.innerHTML = `<b>${m.name}</b><br><span>${m.size}</span>`;
    stage.appendChild(d);
  }

  // Normalise each model to fit a 2.6 m box (max dimension), feet on ground.
  const CELL = 2.6;
  for (const m of panel.models) {
    loader.load(m.file, (gltf) => {
      const root = gltf.scene;
      scene.add(root);
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const s = CELL / maxDim;
      root.scale.setScalar(s);
      root.rotation.y = Math.PI * 0.15; // slight 3/4 turn
      root.updateMatrixWorld(true);
      const box2 = new THREE.Box3().setFromObject(root);
      root.position.x = m.x - (box2.min.x + box2.max.x) / 2;
      root.position.y = -box2.min.y;
      root.position.z = m.z - (box2.min.z + box2.max.z) / 2;
      root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });
      console.log(m.name, 'real size:', size.x.toFixed(2), 'x', size.y.toFixed(2), 'x', size.z.toFixed(2), 'm, scale', s.toFixed(2));
      loaded.push(m.name);
      addLabel(m);
      if (--pending === 0) finish();
    }, undefined, (err) => {
      console.error(m.name, 'FAILED', err);
      failed.push(m.name);
      if (--pending === 0) finish();
    });
  }

  (function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  })();
}

function finish() {
  statusEl.textContent = 'loaded: ' + loaded.length + '/20' + (failed.length ? ' | FAILED: ' + failed.join(', ') : '');
  window.__READY__ = true;
}

for (const panel of PANELS) buildPanel(panel);
</script>
</body>
</html>
