<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vinish Houses — Sample</title>
<style>
  html, body { margin: 0; padding: 0; background: #f2ede4; font-family: "Courier New", monospace; }
  #title { text-align: center; font-size: 26px; font-weight: bold; letter-spacing: 4px; padding: 16px 0 4px; color: #222; }
  #sub { text-align: center; font-size: 13px; color: #555; padding-bottom: 8px; }
  #stage { position: relative; width: 1500px; height: 900px; margin: 0 auto; }
  #stage canvas { display: block; }
  .label { position: absolute; transform: translate(-50%, 0); background: rgba(255,255,255,0.92); border: 1px solid #ccc; border-radius: 6px; padding: 5px 10px; text-align: center; font-size: 13px; line-height: 1.45; color: #222; white-space: nowrap; }
  .label b { font-size: 14px; }
  .label span { color: #666; font-size: 11px; }
  #status { text-align: center; font-size: 13px; color: #888; padding: 8px; }
</style>
<script type="importmap">
{ "imports": { "three": "../game/vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="title">VINISH HOUSES — SAMPLE</div>
<div id="sub">13 free models (CC BY 4.0) · loaded as GLB in Three.js · each normalised to fit its cell · ★ = already downloaded</div>
<div id="stage"></div>
<div id="status">loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './models/GLTFLoader.js';

// Grid: 5 cols (x) x 3 rows (z). Row 1 = houses, Row 2 = houses + ★ already-have, Row 3 = town (shops/apartments).
const MODELS = [
  // Row 1 (back, z = -6): new houses
  { file: 'models/vinish-assets/mediterranean-villa.glb', name: 'Mediterranean Villa', cat: 'Villa', size: '1.6 MB', x: -7.4, z: -6 },
  { file: 'models/vinish-assets/a-frame-cabin.glb', name: 'A-Frame Cabin', cat: 'Cabin', size: '676 KB', x: -3.7, z: -6 },
  { file: 'models/vinish-assets/container-home.glb', name: 'Container Home', cat: 'House', size: '388 KB', x: 0, z: -6 },
  { file: 'models/vinish-assets/townhouses.glb', name: 'Townhouses', cat: 'Row houses', size: '1.1 MB', x: 3.7, z: -6 },
  { file: 'models/vinish-assets/family-house.glb', name: 'Family House', cat: 'House', size: '709 KB', x: 7.4, z: -6 },
  // Row 2 (middle, z = 0): new houses + already-downloaded
  { file: 'models/vinish-assets/bungalow.glb', name: 'Bungalow', cat: 'House', size: '520 KB', x: -7.4, z: 0 },
  { file: 'models/vinish-assets/log-cabin.glb', name: 'Log Cabin', cat: 'Cabin', size: '1.1 MB', x: -3.7, z: 0 },
  { file: 'models/vinish-assets/tiny-house.glb', name: 'Tiny House', cat: 'Tiny house', size: '334 KB', x: 0, z: 0 },
  { file: 'models/vinish-assets/modern-house.glb', name: '★ Modern House', cat: 'House', size: '453 KB', x: 3.7, z: 0 },
  { file: 'models/vinish-assets/beach-house.glb', name: '★ Beach House', cat: 'House', size: '671 KB', x: 7.4, z: 0 },
  // Row 3 (front, z = 6): colorful-town shops/apartments
  { file: 'models/vinish-assets/corner-cafe.glb', name: 'Corner Café', cat: 'Town · Café', size: '2.8 MB', x: -3.7, z: 6 },
  { file: 'models/vinish-assets/supermarket.glb', name: 'Supermarket', cat: 'Town · Shop', size: '1.2 MB', x: 0, z: 6 },
  { file: 'models/vinish-assets/balcony-apartments.glb', name: 'Balcony Apartments', cat: 'Town · Flats', size: '4.6 MB', x: 3.7, z: 6 },
];

const W = 1500, H = 900;
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2ede4);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
camera.position.set(0, 11, 20.5);
camera.lookAt(0, 1.0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cdb8, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.camera.far = 40;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7);
fill.position.set(-8, 6, 6);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 30),
  new THREE.MeshStandardMaterial({ color: 0xe2d9c8, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
const loaded = [];
const failed = [];

function worldToScreen(wx, wy, wz) {
  const v = new THREE.Vector3(wx, wy, wz).project(camera);
  return { px: (v.x * 0.5 + 0.5) * W, py: (-v.y * 0.5 + 0.5) * H };
}

function addLabel(m) {
  const p = worldToScreen(m.x, 0, m.z);
  const d = document.createElement('div');
  d.className = 'label';
  d.style.left = p.px + 'px';
  d.style.top = (p.py + 6) + 'px';
  d.innerHTML = `<b>${m.name}</b><br><span>${m.cat} · ${m.size}</span>`;
  stage.appendChild(d);
}

// Normalise each model to fit a 2.6 m box (max dimension), feet on ground.
const CELL = 2.6;
let pending = MODELS.length;
for (const m of MODELS) {
  loader.load(m.file, (gltf) => {
    const root = gltf.scene;
    scene.add(root);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3();
    box.getSize(size);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const s = CELL / maxDim;
    root.scale.setScalar(s);
    root.rotation.y = Math.PI * 0.15; // slight 3/4 turn
    root.updateMatrixWorld(true);
    const box2 = new THREE.Box3().setFromObject(root);
    root.position.x = m.x - (box2.min.x + box2.max.x) / 2;
    root.position.y = -box2.min.y;
    root.position.z = m.z - (box2.min.z + box2.max.z) / 2;
    root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });
    console.log(m.name, 'real size:', size.x.toFixed(2), 'x', size.y.toFixed(2), 'x', size.z.toFixed(2), 'm, scale', s.toFixed(2));
    loaded.push(m.name);
    addLabel(m);
    if (--pending === 0) finish();
  }, undefined, (err) => {
    console.error(m.name, 'FAILED', err);
    failed.push(m.name);
    if (--pending === 0) finish();
  });
}

function finish() {
  statusEl.textContent = 'loaded: ' + loaded.length + '/13' + (failed.length ? ' | FAILED: ' + failed.join(', ') : '');
  window.__READY__ = true;
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
